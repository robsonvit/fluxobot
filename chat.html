<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body class="pagina-chat">
  <div id="chat"></div>
  <script src="chat.js"></script>
  <script>
    // Cada bot é um arquivo em bots/. Use chat.html?f=nome-do-bot (sem ?f usa o bot "padrao")
    const nome = new URLSearchParams(location.search).get("f") || "padrao";
    const seguro = /^[\w-]+$/.test(nome) ? nome : "padrao";
    const lerJson = (url) => fetch(url).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });

    // config.json guarda o endereço da planilha (registro automático de acessos e respostas)
    const configuracao = lerJson("config.json?v=" + Date.now()).catch(() => ({}));

    Promise.all([lerJson("bots/" + seguro + ".json"), configuracao])
      .then(([fluxo, cfg]) => {
        const registroUrl = cfg && cfg.rastreio && cfg.planilha ? cfg.planilha : null;
        FluxoChat.executar(fluxo, document.getElementById("chat"), { registroUrl });
      })
      .catch(() => { document.getElementById("chat").textContent = "Não consegui carregar o fluxo."; });
  </script>
</body>
</html>
