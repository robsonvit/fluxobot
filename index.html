<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FluxoBot - Editor</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body class="editor">
  <div class="barra">
    <h1>FluxoBot</h1>
    <input type="text" id="nome" placeholder="Nome do fluxo" title="Nome do fluxo">
    <span class="sep"></span>
    <button data-add="mensagem">+ Mensagem</button>
    <button data-add="pergunta">+ Pergunta</button>
    <button data-add="botoes">+ Botões</button>
    <button data-add="imagem">+ Imagem</button>
    <button data-add="audio">+ Áudio</button>
    <button data-add="video">+ Vídeo</button>
    <button data-add="espera">+ Pausa</button>
    <button data-add="redirecionar">+ Link</button>
    <button data-add="webhook">+ Enviar dados</button>
    <button data-add="fim">+ Fim</button>
    <span class="sep"></span>
    <button id="btn-testar" class="principal">▶ Testar</button>
    <button id="btn-tema">🎨 Aparência</button>
    <select id="sel-bot" title="Escolha o bot"></select>
    <button id="btn-novo-bot">+ Novo bot</button>
    <button id="btn-link">🔗 Copiar link</button>
    <button id="btn-salvar" class="principal">💾 Salvar</button>
    <button id="btn-carregar">☁ Recarregar</button>
    <span id="status" class="dica" style="margin-left:0"></span>
    <button id="btn-baixar">⬇ Baixar fluxo.json</button>
    <label class="btn" title="Aceita fluxos do FluxoBot e exportados do Typebot">⬆ Importar .json<input type="file" id="arquivo" accept=".json" hidden></label>
    <button id="btn-novo">Novo exemplo</button>
    <span class="dica">Clique na bolinha da direita e depois na da esquerda de outro bloco para ligar. Clique na linha para apagar.</span>
  </div>
  <div class="area">
    <div id="canvas"><div id="quadro"><svg id="linhas"></svg></div></div>
    <aside id="tema"></aside>
    <aside id="teste">
      <div class="topo"><span>Teste do chat</span><span><button id="btn-reiniciar" title="Reiniciar">↻</button><button id="btn-fechar">✕</button></span></div>
      <div id="conversa"></div>
    </aside>
  </div>
  <script src="chat.js"></script>
  <script src="importar-typebot.js"></script>
  <script src="editor.js"></script>
  <script src="salvar-github.js"></script>
  <script src="tema.js"></script>
</body>
</html>
